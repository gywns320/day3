<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 장소 지도</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        body { font-family: sans-serif; margin: 0; }
        #bar { padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #map { height: 70vh; }
        #msg { padding: 0 8px 8px; color: #555; }
    </style>
</head>
<body>
    <div id="bar">
        지역
        <select id="area">
            <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
        </select>
        실내
        <select id="indoor">
            <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
        </select>
        <button id="go">찾기</button>
    </div>
    <div id="msg"></div>
    <div id="map"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
            integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
    <script src="6.js"></script>
</body>
</html>
