<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 날씨 맞춤 추천 에이전트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; line-height: 1.5; }
        h1 { font-size: 22px; }
        textarea { width: 100%; box-sizing: border-box; height: 72px; padding: 8px; font: inherit; }
        button { padding: 8px 14px; font: inherit; cursor: pointer; }
        .ex { margin: 8px 0; display: flex; gap: 6px; flex-wrap: wrap; }
        .ex button { font-size: 13px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 14px; }
        #steps { margin: 16px 0 8px; padding: 0; list-style: none; font-size: 14px; color: #444; }
        #steps li { padding: 6px 10px; margin-bottom: 4px; background: #f3f4f6; border-radius: 6px; }
        #answer { padding: 12px; border-radius: 8px; background: #ecfdf5; white-space: pre-wrap; display: none; }
        #spots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        #spots span { padding: 3px 10px; border-radius: 12px; background: #fff7ed; border: 1px solid #fed7aa; font-size: 13px; }
        #map { height: 340px; margin-top: 12px; border-radius: 8px; }
        small { color: #777; }
    </style>
</head>
<body>
    <h1>🌤️ 제주 날씨 맞춤 추천 에이전트</h1>
    <p><small>Claude가 날씨(Open-Meteo)와 장소 목록 도구를 스스로 골라 호출해 추천합니다.</small></p>
    <textarea id="q" maxlength="300" placeholder="예) 서귀포에서 오늘 갈 만한 곳 추천해줘"></textarea>
    <div class="ex">
        <button type="button">제주시에서 오늘 뭐 하지?</button>
        <button type="button">서귀포 바다 보러 가고 싶어</button>
        <button type="button">동쪽에서 아이랑 갈 만한 곳</button>
    </div>
    <button id="go" type="button">추천받기</button>
    <ul id="steps"></ul>
    <div id="answer"></div>
    <div id="spots"></div>
    <div id="map"></div>
    <small>지도 위치는 지역 중심 근처에 흩어 표시한 것이며 정확한 좌표가 아닙니다.</small>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
            integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
