<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 날씨 맞춤 추천 에이전트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        :root {
            --bg: #f3f7f9; --card: #ffffff; --text: #17262e; --muted: #5d7480; --line: #e1eaee;
            --brand: #0e9aa7; --brand-2: #3fb68b; --brand-ink: #ffffff;
            --chip: #e8f6f7; --chip-line: #bfe3e6; --step: #f1f6f8; --answer: #effaf5; --answer-line: #bfe8d4;
            --spot: #fff4e6; --spot-line: #fcd9a8; --shadow: 0 8px 28px rgba(14, 60, 80, .10);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1a20; --card: #14252d; --text: #e6f1f4; --muted: #8fa9b4; --line: #23404b;
                --chip: #17343b; --chip-line: #26515b; --step: #18303a; --answer: #14332a; --answer-line: #23604a;
                --spot: #3a2c17; --spot-line: #6b5127; --shadow: 0 8px 28px rgba(0, 0, 0, .35);
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
               font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
        .hero { padding: 44px 16px 84px; text-align: center; color: #fff;
                background: linear-gradient(135deg, #0b7f8c 0%, #0e9aa7 45%, #3fb68b 100%); }
        .hero h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 34px); letter-spacing: -.02em; }
        .hero p { margin: 0 auto; max-width: 520px; opacity: .92; font-size: 15px; }
        main { max-width: 680px; margin: -52px auto 40px; padding: 0 16px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
                box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
        textarea { width: 100%; height: 84px; padding: 12px 14px; font: inherit; color: var(--text);
                   background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; resize: vertical; }
        textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14, 154, 167, .18); }
        .ex { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
        .ex button { padding: 6px 12px; font: inherit; font-size: 13px; color: var(--text); cursor: pointer;
                     background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px;
                     transition: transform .12s, border-color .12s; }
        .ex button:hover { transform: translateY(-1px); border-color: var(--brand); }
        #go { width: 100%; padding: 13px; font: inherit; font-weight: 700; font-size: 16px; color: var(--brand-ink);
              cursor: pointer; border: 0; border-radius: 12px;
              background: linear-gradient(90deg, var(--brand), var(--brand-2));
              transition: transform .12s, box-shadow .12s, opacity .12s; }
        #go:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(14, 154, 167, .35); }
        #go:disabled { opacity: .65; cursor: progress; }
        #steps { margin: 0; padding: 0; list-style: none; font-size: 14px; }
        #steps:empty { display: none; }
        #steps li { padding: 8px 12px; margin-top: 8px; background: var(--step); border-radius: 10px;
                    border-left: 4px solid var(--brand); color: var(--muted); animation: pop .25s ease; }
        #answer { display: none; margin-top: 12px; padding: 14px 16px; border-radius: 12px; white-space: pre-wrap;
                  background: var(--answer); border: 1px solid var(--answer-line); animation: pop .25s ease; }
        #spots { display: flex; gap: 6px; flex-wrap: wrap; }
        #spots:not(:empty) { margin-top: 12px; }
        #spots span { padding: 4px 11px; border-radius: 999px; font-size: 13px;
                      background: var(--spot); border: 1px solid var(--spot-line); animation: pop .25s ease; }
        .result:empty { display: none; }
        #map { height: 360px; border-radius: 14px; border: 1px solid var(--line); z-index: 0; }
        .note { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
        @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <header class="hero">
        <h1>🌤️ 제주 날씨 맞춤 추천</h1>
        <p>Gemini가 날씨(Open-Meteo)와 장소 목록을 스스로 확인해서, 오늘 가기 좋은 곳을 골라 드려요.</p>
    </header>
    <main>
        <section class="card">
            <textarea id="q" maxlength="300" placeholder="예) 서귀포에서 오늘 갈 만한 곳 추천해줘"></textarea>
            <div class="ex">
                <button type="button">제주시에서 오늘 뭐 하지?</button>
                <button type="button">서귀포 바다 보러 가고 싶어</button>
                <button type="button">동쪽에서 아이랑 갈 만한 곳</button>
            </div>
            <button id="go" type="button">추천받기</button>
            <ul id="steps"></ul>
            <div id="answer"></div>
            <div id="spots"></div>
        </section>
        <section class="card">
            <div id="map"></div>
            <p class="note">지도 위치는 지역 중심 근처에 흩어 표시한 것이며 정확한 좌표가 아닙니다.</p>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
            integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
