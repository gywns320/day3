<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS 실시간 추적</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        html, body { height: 100%; margin: 0; background: #0b1020; color: #e8ecff; font-family: sans-serif; }
        #map { position: absolute; inset: 0; background: #0b1020; }
        #panel { position: absolute; z-index: 1000; top: 12px; left: 12px; right: 12px; max-width: 340px;
                 padding: 12px 14px; border-radius: 12px; background: rgba(11,16,32,.85);
                 backdrop-filter: blur(6px); border: 1px solid rgba(120,150,255,.35); }
        #panel h1 { margin: 0 0 8px; font-size: 18px; }
        #panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
        #panel dt { color: #9fb0ff; }
        #panel dd { margin: 0; font-variant-numeric: tabular-nums; }
        #panel label { display: block; margin-top: 8px; font-size: 13px; }
        #status { margin-top: 6px; font-size: 12px; color: #9fb0ff; }
        .iss { font-size: 34px; filter: drop-shadow(0 0 8px #7aa2ff); }
        .leaflet-container { font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="panel">
        <h1>🛰️ ISS 실시간 위치</h1>
        <dl>
            <dt>위도</dt><dd id="lat">-</dd>
            <dt>경도</dt><dd id="lon">-</dd>
            <dt>고도</dt><dd id="alt">-</dd>
            <dt>속도</dt><dd id="vel">-</dd>
            <dt>지금 아래</dt><dd id="under">-</dd>
        </dl>
        <label><input type="checkbox" id="follow" checked> ISS 따라가기</label>
        <div id="status">불러오는 중…</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
            integrity="sha256-XJrs/DDkVkUZ29zdzFOkGCJ9zHVo5hnpdi3c7HYJ7Uc=" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
